{% extends "home/base.html" %}
{% block title %}
    {{ title }}
{% endblock title %}

{% block content %}
    <div class="container-fluid event_container my-4">
        <div class="container">
            <h1 class="border-bottom custom-border conv-title">
                {{ title }}
            </h1>
    
            <div class="content-section">
                <form action="." method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
            
                    <div class="space-y-4 message_form">
                        <p class="message_info">
                            Message <span>@{{ event.created_by }}</span> about <span>{{ event.name }}</span>
                        </p>
                        {{ form.as_p }}
                    </div>
            
                    <div class="form-group">
                        <button class="btn auth-btn" type="submit">
                            Send
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock content %}
